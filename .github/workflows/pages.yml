# haveo.app — published by GitHub Pages from this repository.
#
# A push to `main` IS the publish. The gate runs first: if page-check.py fails,
# nothing goes live. Only the site is uploaded — the generator, its content, the
# gate and the notes stay in the repository and are never served.
name: Publish haveo.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate — page-check.py
        run: python3 page-check.py

      - name: Assemble the site (source files left out)
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude '.gitignore' --exclude '__pycache__' \
            --exclude 'README.md' --exclude 'PAGE-QUEUE.md' \
            --exclude 'build-pages.py' --exclude 'content.py' --exclude 'page-check.py' \
            --exclude 'page-dates.json' --exclude 'netlify.toml' --exclude 'qa'
          test -f _site/index.html && test -f _site/CNAME && test -f _site/404.html
          ! test -e _site/content.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4

      # Tell Bing (and through it ChatGPT and Perplexity search) which pages
      # changed. The key file has been live since September but nothing ever
      # submitted to it, so Bing was never told the guides existed (found
      # 2026-10-06). Never blocks a publish: a failed ping is logged, not fatal.
      - name: IndexNow — submit changed pages
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          KEY=8e5ecfb486d62afbee1a9503a631ecf7
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE=HEAD~1; fi
          URLS=$(git diff --name-only "$BEFORE" HEAD -- '*.html' \
            | grep -E '(^|/)index\.html$' \
            | sed -E 's#^index\.html$##; s#/index\.html$#/#' \
            | sed 's#^#https://haveo.app/#' | sort -u)
          if [ -z "$URLS" ]; then echo "no page changed"; exit 0; fi
          echo "$URLS"
          BODY=$(printf '%s\n' "$URLS" | python3 -c 'import json,sys; print(json.dumps({"host":"haveo.app","key":"'$KEY'","keyLocation":"https://haveo.app/'$KEY'.txt","urlList":[l.strip() for l in sys.stdin if l.strip()]}))')
          curl -sS -o /dev/null -w "indexnow %{http_code}\n" -H 'Content-Type: application/json' -d "$BODY" https://api.indexnow.org/indexnow
