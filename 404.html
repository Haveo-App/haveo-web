<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Haveo</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Same tokens as index.html, so a wrong link still looks like Haveo. */
    :root{
      --bg:#FBF7F0; --card:#FFFFFF; --ink:#1A2238; --muted:#5B6472;
      --blue:#2563EB; --blue-dark:#1D4ED8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--ink);
      font-family:'Quicksand',-apple-system,BlinkMacSystemFont,sans-serif;
      font-weight:500; line-height:1.6;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:32px 24px; text-align:center;
    }
    .card{
      background:var(--card); border-radius:20px; padding:40px 32px;
      max-width:460px; width:100%;
      box-shadow:0 10px 30px rgba(26,34,56,.08);
    }
    img.char{width:104px; height:104px; margin-bottom:8px}
    h1{font-size:26px; font-weight:700; margin:8px 0 0; letter-spacing:-.01em}
    p{color:var(--muted); font-size:16.5px; margin:12px 0 0}
    .btns{display:flex; flex-direction:column; gap:12px; margin-top:28px}
    a.btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      text-decoration:none; font-weight:700; font-size:16px;
      border-radius:999px; padding:15px 26px; min-height:52px;
    }
    a.primary{background:var(--blue); color:#fff}
    a.primary:hover,a.primary:focus{background:var(--blue-dark)}
    a.ghost{color:var(--blue); border:2px solid rgba(37,99,235,.25)}
    a.ghost:hover,a.ghost:focus{border-color:var(--blue)}
    a.btn:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
    @media (prefers-reduced-motion:no-preference){
      a.btn{transition:background .15s ease, border-color .15s ease}
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="char" src="/illustrations/characters/char-27-blue.svg"
         alt="The Haveo character, looking around" />
    <h1>This page isn't here</h1>
    <p>The link may be old, or it may have a typo. Haveo itself is on the App Store.</p>

    <div class="btns">
      <a class="btn primary" href="https://apps.apple.com/app/haveo/id6774740212">
        Download on the App Store
      </a>
      <a class="btn ghost" href="/">Go to haveo.app</a>
    </div>
  </main>
</body>
</html>
